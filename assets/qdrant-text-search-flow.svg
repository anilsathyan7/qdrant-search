<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Qdrant Text Search Flow</title>
  <desc id="desc">A flow diagram showing dataset ingestion, chunking, embedding, Qdrant upload, query embedding, hybrid search, ranked results, and evaluation metrics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="980" height="430" rx="16" fill="#f8fafc"/>

  <text x="40" y="52" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Qdrant Text Search Flow</text>
  <text x="40" y="82" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="15">Build, search, and evaluate hybrid retrieval over docs-style JSON.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="40" y="130" width="145" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="112.5" y="162" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Docs JSON</text>
      <text x="112.5" y="185" fill="#64748b" font-size="12" text-anchor="middle">datasets/*.json</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="240" y="130" width="145" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="312.5" y="162" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Chunk Text</text>
      <text x="312.5" y="185" fill="#64748b" font-size="12" text-anchor="middle">LlamaIndex</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="440" y="130" width="145" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="512.5" y="162" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Embed Chunks</text>
      <text x="512.5" y="185" fill="#64748b" font-size="12" text-anchor="middle">dense, sparse, ColBERT</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="640" y="130" width="145" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="712.5" y="162" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Qdrant</text>
      <text x="712.5" y="185" fill="#64748b" font-size="12" text-anchor="middle">vectors + payload</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="40" y="292" width="145" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="112.5" y="324" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">User Query</text>
      <text x="112.5" y="347" fill="#64748b" font-size="12" text-anchor="middle">natural language</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="240" y="292" width="145" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="312.5" y="324" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Embed Query</text>
      <text x="312.5" y="347" fill="#64748b" font-size="12" text-anchor="middle">same vector types</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="440" y="292" width="145" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="512.5" y="324" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Hybrid Search</text>
      <text x="512.5" y="347" fill="#64748b" font-size="12" text-anchor="middle">RRF + rerank</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="640" y="292" width="145" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="712.5" y="324" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Ranked Results</text>
      <text x="712.5" y="347" fill="#64748b" font-size="12" text-anchor="middle">top matches</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="835" y="292" width="105" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="887.5" y="324" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Eval</text>
      <text x="887.5" y="347" fill="#64748b" font-size="12" text-anchor="middle">recall, MRR</text>
    </g>
  </g>

  <g fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M185 168 H232"/>
    <path d="M385 168 H432"/>
    <path d="M585 168 H632"/>
    <path d="M185 330 H232"/>
    <path d="M385 330 H432"/>
    <path d="M585 330 H632"/>
    <path d="M785 330 H827"/>
    <path d="M712.5 206 V251 C712.5 274 585 274 548 292"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">
    <text x="448" y="108">FastEmbed or FlagEmbedding/BGE-M3</text>
    <text x="606" y="258">stored collection</text>
  </g>
</svg>
